<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>33rd All Kerala Kerala Quiz 2026 | CLC Muttom Cherthala</title>

  <meta
    name="description"
    content="33rd All Kerala Kerala Quiz 2026 organized by CLC Muttom Cherthala. View the quiz poster and register online."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

  <style>
    .quiz-page {
      min-height: 100vh;
      padding: 60px 20px 80px;
      background: #f7f8fa;
      box-sizing: border-box;
    }

    .quiz-container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .quiz-heading {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-heading h1 {
      margin: 0 0 12px;
      font-family: "Playfair Display", serif;
      font-size: clamp(32px, 5vw, 52px);
      color: #071d3b;
    }

    .quiz-heading p {
      margin: 0;
      font-family: "Manrope", sans-serif;
      color: #555;
      font-size: 16px;
    }

    .quiz-card {
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.10);
      text-align: center;
    }

    .quiz-poster {
      display: block;
      width: 100%;
      max-width: 750px;
      height: auto;
      margin: 0 auto 30px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }

    .quiz-info {
      max-width: 750px;
      margin: 0 auto 30px;
      font-family: "Manrope", sans-serif;
    }

    .quiz-info h2 {
      margin: 0 0 10px;
      color: #071d3b;
      font-size: 25px;
    }

    .quiz-info p {
      margin: 8px 0;
      color: #555;
      line-height: 1.7;
    }

    .register-button {
      display: inline-block;
      padding: 15px 32px;
      background: #071d3b;
      color: #fff !important;
      text-decoration: none;
      border-radius: 50px;
      font-family: "Manrope", sans-serif;
      font-size: 16px;
      font-weight: 800;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(7,29,59,0.25);
    }

    .register-button:hover {
      transform: translateY(-3px);
      background: #d4af37;
      color: #071d3b !important;
    }

    .back-button {
      display: inline-block;
      margin-top: 25px;
      color: #071d3b;
      text-decoration: none;
      font-family: "Manrope", sans-serif;
      font-weight: 700;
    }

    .back-button:hover {
      color: #b38f00;
    }

    @media (max-width: 600px) {
      .quiz-page {
        padding: 35px 12px 60px;
      }

      .quiz-card {
        padding: 12px;
        border-radius: 15px;
      }

      .quiz-poster {
        border-radius: 10px;
        margin-bottom: 22px;
      }

      .quiz-heading {
        margin-bottom: 25px;
      }

      .quiz-info h2 {
        font-size: 21px;
      }

      .register-button {
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
</head>

<body>


  <!-- QUIZ PAGE -->
  <main class="quiz-page">

    <div class="quiz-container">

      <div class="quiz-heading">
        <h1>33rd All Kerala Kerala Quiz 2026</h1>
        <p>CLC Muttom Cherthala</p>
      </div>


      <div class="quiz-card">

        <!-- QUIZ POSTER -->
        <img
          src="kerala-quiz-33-poster.jpg"
          alt="33rd All Kerala Kerala Quiz 2026 Poster"
          class="quiz-poster"
        >


        <!-- INFORMATION -->
        <div class="quiz-info">

          <h2>33rd All Kerala Kerala Quiz 2026</h2>

          <p>
            Take part in the 33rd All Kerala Kerala Quiz and showcase
            your knowledge about Kerala, its culture, history and heritage.
          </p>

        </div>


        <!-- REGISTRATION BUTTON -->
        <a
          href="https://forms.gle/e92Lx1BqwLtii3b97"
          target="_blank"
          rel="noopener noreferrer"
          class="register-button"
        >
          📝 REGISTER NOW
        </a>


        <br>

        <a href="index.html" class="back-button">
          ← Back to CLC Muttom
        </a>

      </div>

    </div>

  </main>


  <!-- FOOTER -->
  <footer>
    <p>
      © 2026 CLC Muttom Cherthala. All Rights Reserved.
    </p>
  </footer>

</body>
</html>
